<!-- Filtering Script -->
<script>
  (function(){
    const buttons = document.querySelectorAll('.filter-btn');
    const items = document.querySelectorAll('#galleryGrid img');

    function applyFilter(filter){
      items.forEach(img => {
        const cat = (img.getAttribute('data-category') || '').toLowerCase();
        const show = (filter === 'all') || (cat === filter);
        img.style.display = show ? 'block' : 'none';
      });
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-selected', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');

        applyFilter(btn.getAttribute('data-filter'));
      });
    });

    // Initial view: show all
    applyFilter('all');
  })();
</script>

<!-- ===== Image Popup Modal ===== -->
<div class="img-popup" id="imgPopup">
  <span class="close-popup" id="closePopup">&times;</span>

  <button class="popup-btn left" id="prevBtn">&#10094;</button>
  <img class="img-popup-content" id="popupImg">
  <button class="popup-btn right" id="nextBtn">&#10095;</button>
</div>

<script>
  const popup = document.getElementById("imgPopup");
  const popupImg = document.getElementById("popupImg");
  const closeBtn = document.getElementById("closePopup");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  const images = document.querySelectorAll("#galleryGrid img");
  let currentIndex = 0;

  // Open popup
  images.forEach((img, index) => {
    img.addEventListener("click", () => {
      popup.style.display = "block";
      popupImg.src = img.src;
      currentIndex = index;
    });
  });

  // Close popup
  closeBtn.onclick = () => {
    popup.style.display = "none";
  };

  // Click outside image closes popup
  popup.addEventListener("click", (e) => {
    if (e.target === popup) {
      popup.style.display = "none";
    }
  });

  // Next image
  nextBtn.onclick = () => {
    currentIndex = (currentIndex + 1) % images.length;
    popupImg.src = images[currentIndex].src;
  };

  // Previous image
  prevBtn.onclick = () => {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    popupImg.src = images[currentIndex].src;
  };

  // Keyboard support
  document.addEventListener("keydown", (e) => {
    if (popup.style.display === "block") {
      if (e.key === "ArrowRight") nextBtn.click();
      if (e.key === "ArrowLeft") prevBtn.click();
      if (e.key === "Escape") popup.style.display = "none";
    }
  });
</script>

<button id="scrollUpBtn">⬆</button>

<script>
  const scrollBtn = document.getElementById("scrollUpBtn");

  window.addEventListener("scroll", () => {
    if (window.scrollY > 300) {
      scrollBtn.classList.add("show");
    } else {
      scrollBtn.classList.remove("show");
    }
  });

  scrollBtn.addEventListener("click", () => {
    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  });
